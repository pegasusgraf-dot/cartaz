<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gerador de Cartazes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome-header h1 {
      font-size: 2rem;
      margin: 0 0 8px 0;
      color: #ffffff;
      font-weight: 700;
    }

    .brand-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #f59e0b;
      margin: 0 0 6px 0;
      letter-spacing: 0.4px;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: #94a3b8;
      margin: 0;
      font-weight: 500;
    }

    .form-container {
      background: #ffffff;
      color: #1e293b;
      padding: 26px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
    }

    .form-container h2 {
      margin-top: 0;
      margin-bottom: 14px;
      color: #1e293b;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .campo {
      margin-bottom: 14px;
    }

    .form-container label {
      font-size: 0.88rem;
      color: #475569;
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-container input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-container input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .form-container button {
      margin-top: 6px;
      cursor: pointer;
      padding: 11px 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      width: 100%;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }

    .form-container button:hover {
      background-color: #1d4ed8;
    }

    .erro {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #b91c1c;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-main-wrapper">
    <div class="welcome-header">
      <h1>Seja bem-vindo!</h1>
      <div class="brand-title">Gerador de Cartazes</div>
      <p class="brand-subtitle">GESTÃO RÁPIDA DE OFERTAS E CARTAZES</p>
    </div>

    <div class="form-container">
      <h2>Entrar no Sistema</h2>

      {% if erro %}
        <div class="erro">{{ erro }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="campo">
          <label for="usuario">Usuário:</label>
          <input id="usuario" name="usuario" type="text" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="senha">Senha:</label>
          <input id="senha" name="senha" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
